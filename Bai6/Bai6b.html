<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>BAI6B-Form Contact Us</title>
</head>
<body>
    <form>
    <div style="border: 1px solid lightblue; padding: auto;">
    <h2>Contact Us</h2>
    <fieldset>
        <legend>Your message:</legend>
        <table>
            <tr>
                <td>
                    To
                </td>
                <td>
                    <input type="text" name="to">
                </td>
            </tr>
            <tr>
                <td>
                    Your email
                </td>
                <td>
                    <input type="text" name="your email">
                </td>
            </tr>
            <tr>
                <td>
                    Message
                </td>
                <td>
                    <textarea></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    Attach File
                </td>
                <td>
                    <input type="file" name="attachfile">
                </td>
            </tr>
        </table>
    </fieldset>
    <fieldset>
        <legend>
            How you found us:
        </legend>
        <table>
            <tr>
                <td>
                    How did you hear of us
                </td>
                <td>
                    <select>
                        <option>Google</option>
                        <option>CocCoc</option>
                        <option>Microsoft</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    Newsletter
                </td>
                <td>
                    <input type="checkbox" id="tick" name="chapnhan">

                    <label for="tick">Ensure this box is checked if you would like to receive email updates</label>
                </td>
            </tr>
        </table>
    </fieldset>
    <p>
        <input type="submit" value="Send message">
    </p>
    </div>
    </form>
</body>
</html>
