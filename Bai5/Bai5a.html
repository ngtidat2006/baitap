<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Movie Day</title>
    <style>
        table {
            width: 100%;
            font-family: Arial, sans-serif;
            outline: 1px solid #ccc;
            outline: offset 5px;
        }
        
        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        
        caption {
            font: size 20px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase
        }
        
        th {
            background-color: #f2f2f2;
        }
    </style>

</head>

<body>
    <table>
        <caption>Classic Movie Day</caption>
        <thead>
            <tr>
                <th></th>
                <th>5 pm</th>
                <th>7 pm</th>
                <th>9pm</th>
                <th>11pm</th>
            </tr>
        </thead>
        <tbody>

            <tr>
                <td><b>Screen one</b></td>
                <td>Star Wars</td>
                <td>Empire Strikes Back</td>
                <td>Return of the Jedi</td>
                <td>The Exorcist</td>
            </tr>
            <tr>
                <td><b>Screen two</b></td>
                <td colspan="2">Dances with Wolves</td>
                <td colspan="2">Gone With the Wind</td>
            </tr>
            <tr>
                <td><b>Screen three</b></td>
                <td colspan="2">2001:A Space Odysey</td>
                <td>The Conversation</td>
                <td>5 Easy Pieces</td>
            </tr>
        </tbody>

    </table>

</body>

</html>
